{% extends 'pedidos/base.html' %}

{% block title %}Eliminar producto | DERM ventas{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <section class="bg-white border border-danger-subtle rounded-3 p-4 p-md-5">
                <p class="text-uppercase small fw-semibold text-danger mb-2">Confirmar eliminación</p>
                <h1 class="h3">¿Eliminar “{{ producto.nombre }}”?</h1>
                <p class="text-secondary">Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                        <button class="btn btn-danger" type="submit">Sí, eliminar producto</button>
                        <a class="btn btn-outline-secondary" href="/productos/lista/">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </div>
{% endblock %}
